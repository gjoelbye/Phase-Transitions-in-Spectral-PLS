[project]
name = "phase-transitions-in-spectral-pls"
version = "0.1.0"
description = "Phase transitions in PLS-SVD under dual MCAR missingness"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]